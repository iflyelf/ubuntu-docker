name: 更新 Go 最新版本号

# 设置触发条件
on:
  # 定时检查(中国时间每天早4点, UTC 前一天20点; 早于镜像构建的5点)
  schedule:
    - cron: '0 20 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: 'update go version'
        required: false
        default: 'manual check'

# 同一分支仅保留最新一次检查
concurrency:
  group: update-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-go:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 获取 Go 最新稳定版本号
      id: go
      run: |
        # Go 官方版本清单接口, 仅返回稳定版, 取第一个即最新
        LATEST=$(curl -fsSL 'https://go.dev/dl/?mode=json' | jq -r '.[0].version' | sed 's/^go//')
        if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
          echo "获取 Go 最新版本失败" >&2
          exit 1
        fi
        echo "最新版本: ${LATEST}"
        echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

    - name: 读取当前 Dockerfile 中的 Go 版本号
      id: current
      run: |
        CURRENT=$(grep -oP 'ARG GO_VERSION=\K[0-9.]+' Dockerfile | head -1)
        echo "当前版本: ${CURRENT}"
        echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

    - name: 更新 Dockerfile 并提交
      if: steps.go.outputs.latest != steps.current.outputs.current
      env:
        LATEST: ${{ steps.go.outputs.latest }}
        CURRENT: ${{ steps.current.outputs.current }}
      run: |
        echo "发现新版本: ${CURRENT} => ${LATEST}, 更新 Dockerfile"
        sed -i "s/^ARG GO_VERSION=.*/ARG GO_VERSION=${LATEST}/" Dockerfile
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Dockerfile
        git commit -m "chore: 更新 Go 版本 ${CURRENT} => ${LATEST}"
        git push

    - name: 无需更新
      if: steps.go.outputs.latest == steps.current.outputs.current
      run: echo "已是最新版本 ${{ steps.current.outputs.current }}, 无需更新"
